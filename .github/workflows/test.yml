name: test

on:
  # Every PR, plus pushes to main and release tags. A branch with an open PR
  # is tested by the PR run, so its commits don't run every job twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # A new commit on a PR cancels that PR's older run. Runs on main and on tags
  # always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # CI runners have no GPU: `uv pip` resolves the CPU torch wheels (~200 MB,
  # not ~2.5 GB of CUDA libraries).
  UV_TORCH_BACKEND: cpu
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version tag (@v10) since v8, only exact
      # releases.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: ruff check
        run: uvx ruff@0.14.14 check .
      - name: ruff format --check
        run: uvx ruff@0.14.14 format --check src tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-15, python: "3.12" } # arm64
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # Defined once here and reused by the floor job (*hf_cache). The key
      # rolls whenever the model registry (hub.py) or DEFAULT_MODEL
      # (config.py) changes, so new weights never meet a stale cache.
      - &hf_cache
        name: Hugging Face cache (weights for the golden tests)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-${{ hashFiles('src/tokeye/hub.py', 'src/tokeye/config.py') }}
      - name: Install
        # uv pip, not uv sync: uv sync ignores UV_TORCH_BACKEND (CPU wheels).
        # The repo's [tool.uv] torch pins apply here, as in a dev checkout.
        run: |
          uv venv
          uv pip install -e ".[all]" --group dev
      - name: Fetch the default weights
        run: uv run --no-sync tokeye download
      - name: pytest
        run: uv run --no-sync pytest -n auto

  smoke:
    # A scientist's laptop: the built wheel in a clean venv with CPU torch,
    # then the quickstart commands.
    name: laptop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: The sdist leaves out the research code
        # source-exclude drops src/tokeye/training from both dists; the wheel
        # is checked after the quickstart.
        run: |
          listing=$(tar -tzf dist/*.tar.gz)
          if grep -q "tokeye/training/" <<<"$listing"; then
            echo "::error::The sdist ships the research code (tokeye/training/):"
            grep "tokeye/training/" <<<"$listing"
            exit 1
          fi
          echo "OK: $(ls dist/*.tar.gz) has no tokeye/training/"
      - name: Install the wheel into a clean venv
        # --no-config: resolve like a user would, without the repo's
        # [tool.uv] torch pins.
        run: |
          uv venv --no-project .smoke
          uv pip install --no-config --python .smoke dist/*.whl
      - name: Quickstart
        working-directory: ${{ runner.temp }}
        run: |
          run() { uv run --no-project --python "$GITHUB_WORKSPACE/.smoke" "$@"; }
          run tokeye --version
          run tokeye info
          run tokeye example --duration 0.5
          run tokeye run tokeye_example_sr200000.npy --device cpu
          test -f tokeye_output/tokeye_example_sr200000_mask.npy
          test -f tokeye_output/tokeye_example_sr200000_params.json
          test -f tokeye_output/tokeye_example_sr200000_preview.png
          run python -c "from tokeye import TokEye; import numpy as np; print(TokEye(device='cpu')(np.load('tokeye_example_sr200000.npy')).shape)"
          # The wheel must not ship the research code (source-exclude).
          run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('tokeye.training') is not None)"
      - name: Add the [app] extra (the README's install line)
        run: uv pip install --no-config --python .smoke "$(ls dist/*.whl)[app]"
      - name: The web app's stack imports and builds
        # `tokeye app --help` is gradio-free by design, so it proves nothing.
        # Import gradio and soundfile (libsndfile), then build the app's UI
        # without starting a server.
        working-directory: ${{ runner.temp }}
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          run() { uv run --no-project --python "$GITHUB_WORKSPACE/.smoke" "$@"; }
          run python -c "import gradio, soundfile; from tokeye.app.__main__ import create_app; app = create_app(); print('app OK:', type(app).__name__, '| gradio', gradio.__version__, '| libsndfile', soundfile.__libsndfile_version__)"
      - name: uvx one-liner
        # uvx honours UV_TORCH_BACKEND, so Linux gets CPU torch here too.
        run: uvx --no-config --from "$(ls dist/*.whl)" tokeye --version

  floor:
    # The oldest supported Python and dependency versions (pyproject floors).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - *hf_cache
      - name: Install the wheel at the dependency floors
        # --no-config: the repo's [tool.uv] pin (torch==2.9.1) would otherwise
        # conflict with the floor constraint (torch==2.4.0).
        run: |
          uv build --wheel
          uv venv --no-project .floor
          uv pip install --no-config --python .floor \
            -c .github/floor-constraints.txt dist/*.whl "pytest>=9" pytest-xdist
      - name: pytest (against the installed wheel)
        run: |
          .floor/bin/tokeye download
          .floor/bin/python -m pytest -n auto -p no:cacheprovider

  large-files:
    # Every blob the push or PR adds, not only the final tree: a big file that
    # a later commit deletes still lands in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the range below resolves
      - name: Reject files larger than 2 MB (whole range, and the tree)
        env:
          # PR: base..head. Push: before..sha. For the all-zeros `before` of a
          # new branch or tag, the script scans the tip's whole history.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/large-files.sh
