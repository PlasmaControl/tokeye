[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "tokeye"
version = "0.12.0"
description = "Automatic classification and localization of fluctuating signals in spectrograms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    # PyTorch 2.11 dropped Volta/V100 (sm_70) from its CUDA wheels; DIII-D's
    # omega GPU partition is V100 (gres=gpu:v100), so we stay below it. Pinned
    # exactly rather than capped: uv.lock is untracked, so a range would let the
    # torch family drift apart between machines.
    "torch==2.9.1",
    "torchvision==0.24.1",  # the torchvision built against torch 2.9.1
    "torchinfo",
    "omegaconf",
    "pydantic",
    "huggingface-hub>=0.30",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
app = [
    # gradio 6 removes Image(show_download_button=...) (used in app/__main__.py)
    # and moves theme=/css= from Blocks() to launch() — the app is 5.x-only.
    "gradio>=5.49,<6",
]
train = [
    "ipykernel",
    "ipywidgets",
    "h5py",
    "wavio",
    "joblib",
    "lightning",
    "torchaudio==2.9.1",  # must match torch exactly, or libtorchaudio.so won't load
    "torchmetrics",
    "scikit-learn",
    "scikit-image",
    "pybaselines",
    "tifffile",
    "pandas",
    "tables",
    "kneed",
    "threadpoolctl",
]

[project.scripts]
tokeye = "tokeye.cli:main"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers"]
markers = [
    "weights: needs the real big_tf_unet weights in the HF cache",
]
testpaths = [
    "tests",
]

[tool.uv]
package = true
# Keep torch/torchvision/torchaudio on ONE index. Mixing a +cuXXX torch with a
# plain-PyPI torchaudio gives an import-time ABI error
# (libtorchaudio.so: undefined symbol ...c10_cuda_check_implementation...).
# "auto" detects the local driver, so CPU boxes and CI resolve correctly too.
torch-backend = "auto"

[tool.uv.build-backend]
module-name = "tokeye"
module-root = "src"

[dependency-groups]
dev = [
    "ty",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    # Pinned: ruff IS the CI gate, so its version has to be reproducible now
    # that uv.lock is untracked. 0.16 flags ~219 pre-existing issues in the
    # legacy training/eval code; upgrading is its own piece of work.
    "ruff>=0.14.5,<0.15",
    "pre-commit",
]
train = [
    "ipykernel",
    "ipywidgets",

    "h5py",
    "wavio",
    "joblib",

    "lightning",
    "torchaudio==2.9.1",  # must match torch exactly, or libtorchaudio.so won't load
    "torchmetrics",

    "scikit-learn",
    "scikit-image",

    "pybaselines",
    "tifffile",
    "pandas",
    "tables",

    "kneed",
    "threadpoolctl",
]
